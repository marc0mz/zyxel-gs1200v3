name: Bug report
description: Report a problem with the integration
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, tokens, or other credentials.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: input
    id: switch_firmware
    attributes:
      label: Switch model and firmware
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce and expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (remove secrets first)
    validations:
      required: false
